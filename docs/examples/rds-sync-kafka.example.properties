# =============================================================================
# rds-sync → Kafka Sink 示例（行级 envelope，不是 mongo-kafka Change Stream）
# =============================================================================
# sink.uri = Kafka bootstrap.servers（可写 kafka://host:9092）
# topic 默认：{kafka.topic.prefix}{sep}{schema}{sep}{table}{sep}{suffix}
# =============================================================================

source.uri=jdbc:mysql://127.0.0.1:3306/demo?useSSL=false
sink.type=kafka
sink.uri=127.0.0.1:9092
sync.mode=FULL

# kafka.topic=  固定单 topic 时取消注释（覆盖按表拼接）
kafka.topic.prefix=rds
kafka.topic.separator=.
# kafka.topic.suffix=
# kafka.ddl.topic=schema-changes
kafka.publish.ddl=true
kafka.acks=all
kafka.linger.ms=5
kafka.compression.type=lz4
kafka.client.id=rds-sync
# 透传 Producer 配置（去掉 kafka.producer. 前缀；P1b 生效）
# kafka.producer.security.protocol=SASL_SSL
# kafka.producer.sasl.mechanism=PLAIN
